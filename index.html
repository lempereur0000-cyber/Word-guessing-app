<body>

  <h1>WORDQUEST: TEMPERATURE CHALLENGE</h1>
  
  <div id="game-info">
    <p><strong>Category:</strong> Science</p>
    <p><strong>Difficulty:</strong> 6-Letter Words</p>
    <p id="guess-counter">Guesses: 0 / 20</p>
  </div>

  <p id="instructions">Guess the secret 6-letter word!</p>

  <form id="guess-form">
    <input 
      type="text" 
      id="guess-input" 
      placeholder="Enter guess..." 
      maxlength="6" 
      required 
      autocomplete="off"
    >
    <button type="submit" id="submit-btn">Submit Guess</button>
  </form>

  <div id="temperature-container">
    <p>Temperature:</p>
    <div id="temperature-bar-bg">
      <div id="temperature-bar"></div>
    </div>
    <p id="temperature-label">Cold</p>
  </div>

  <p id="status-message"></p>

  <script src="script.js"></script>
</body>
